name: market data feed
# Each run is a 5.5-hour snapshot loop that dispatches its own successor a few minutes before it ends, so the feed
# keeps itself alive (24/5, slow heartbeat when the market is closed). The hourly cron is only a restarter: GitHub
# skips scheduled runs freely (it fired once on Fri 10/9 and once on Mon 10/12), so nothing here depends on it.
on:
  schedule:
    - cron: "0 8-23 * * 1-5"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "How long this run loops before handing off (default 330; use 6 to test the handoff)"
        required: false
        default: "330"
permissions:
  contents: write
  actions: write        # lets the loop dispatch the next run with GITHUB_TOKEN
concurrency: { group: data-feed, cancel-in-progress: true }
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: snapshot loop (~1 min cadence while the market is open, hands off to the next run)
        env:
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
          EVERY_SEC: "60"
          HANDOFF_MINUTES: "4"
          PUSH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FEED_REF: ${{ github.ref_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # optional: feed watchdog alerts (add the secret in repo settings)
        run: node scripts/snapshot.mjs
