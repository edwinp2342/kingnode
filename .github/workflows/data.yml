name: market data snapshot
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # every 5 min, 9:00–17:55 ET (13:00–21:55 UTC during daylight time)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: true }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/snapshot.mjs
      - name: push to data branch
        run: |
          cd data
          git init -q -b data
          git config user.name kingnode-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
