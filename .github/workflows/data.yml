name: market data feed
on:
  schedule:
    - cron: "0 8-23 * * 1-5"   # a new 58-minute loop every hour, 4:00 AM–7:59 PM ET (daylight time) — pre-market through after-hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-feed, cancel-in-progress: true }
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: snapshot loop (~1 min cadence, pushes each cycle)
        env:
          LOOP_MINUTES: "58"
          EVERY_SEC: "60"
          PUSH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/snapshot.mjs
