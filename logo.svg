<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170">
  <g transform="translate(10,10) scale(0.5859)"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141B26"/><stop offset="0.55" stop-color="#0A0E14"/><stop offset="1" stop-color="#04060A"/></linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ADCC6"/><stop offset="0.5" stop-color="#3E9A8B"/><stop offset="1" stop-color="#14413F"/></linearGradient>
    <linearGradient id="barEdge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.25"/></linearGradient>
    <radialGradient id="node" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#FFF1C2"/><stop offset="0.45" stop-color="#F5B942"/><stop offset="1" stop-color="#B97E0A"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F5B942" stop-opacity="0.45"/><stop offset="1" stop-color="#F5B942" stop-opacity="0"/></radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B942" stop-opacity="0.35"/><stop offset="0.5" stop-color="#F5B942"/><stop offset="1" stop-color="#F5B942" stop-opacity="0.35"/></linearGradient>
    <clipPath id="rounded"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#sheen)"/>
    <!-- the strike ladder, faint -->
    <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
      <line x1="28" y1="72" x2="228" y2="72"/><line x1="28" y1="104" x2="228" y2="104"/><line x1="28" y1="136" x2="228" y2="136"/><line x1="28" y1="168" x2="228" y2="168"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="255" height="255" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- halo behind the king node -->
  <circle cx="128" cy="76" r="36" fill="url(#halo)"/>
  <!-- crown teeth: pointed bars = the gamma profile -->
  <g>
    <path d="M66 190 V140 L80 124 L94 140 V190 Z" fill="url(#bar)"/>
    <path d="M66 190 V140 L80 124 L94 140 V190 Z" fill="url(#barEdge)"/>
    <path d="M114 190 V102 L128 86 L142 102 V190 Z" fill="url(#bar)"/>
    <path d="M114 190 V102 L128 86 L142 102 V190 Z" fill="url(#barEdge)"/>
    <path d="M162 190 V140 L176 124 L190 140 V190 Z" fill="url(#bar)"/>
    <path d="M162 190 V140 L176 124 L190 140 V190 Z" fill="url(#barEdge)"/>
  </g>
  <!-- spot baseline -->
  <rect x="50" y="192" width="156" height="7" rx="3.5" fill="url(#base)"/>
  <!-- the king node -->
  <circle cx="128" cy="68" r="14" fill="url(#node)"/>
  <circle cx="128" cy="68" r="14" fill="none" stroke="#0A0E14" stroke-width="2.5"/>
  <circle cx="128" cy="68" r="19" fill="none" stroke="#F5B942" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- the walls -->
  <circle cx="80" cy="112" r="5" fill="#F5B942" opacity="0.9"/>
  <circle cx="176" cy="112" r="5" fill="#F5B942" opacity="0.9"/>
</g>
  <text x="186" y="104" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="5" fill="#E8EAEE">KING<tspan fill="#9ADCC6">NODE</tspan></text>
</svg>
