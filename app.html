<style>
:root{

  --pos:#26A69A; --neg:#EF5350; --gold:#F5B942; --gold-ink:#131722; --spot:#F5B942; --blue:#2962FF;
  --sans:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --bg:#131722; --panel:#1E222D; --panel2:#2A2E39; --ink:#D1D4DC; --muted:#787B86; --rule:#2A2E39; --rule2:#363A45 }
:root[data-theme="light"]{ --bg:#FFFFFF; --panel:#F8F9FD; --panel2:#EEF0F5; --ink:#131722; --muted:#6A6D78; --rule:#E0E3EB; --rule2:#D1D4DC; --gold:#E0A100; --spot:#E0A100; color-scheme:light }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 var(--sans)}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
a{color:var(--blue)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.tape{height:34px; border-bottom:1px solid var(--rule); background:var(--bg); overflow:hidden; position:relative}
.tape-in{display:flex; gap:0; height:100%; align-items:center; white-space:nowrap; will-change:transform}
.tape-in.anim{animation:tape 60s linear infinite}
.tape:hover .tape-in.anim{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)} to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){ .tape-in.anim{animation:none} .tape{overflow-x:auto} }
.tq{display:inline-flex; align-items:baseline; gap:7px; padding:0 18px; font-family:var(--mono); font-size:12.5px; border-right:1px solid var(--rule); cursor:pointer; height:100%; align-items:center}
.tq:hover{background:var(--panel)}
.tq b{font-weight:700; color:var(--ink)} .tq .p{color:var(--ink); font-weight:600} .tq .c{color:var(--pos)} .tq .d{color:var(--neg)} .tq small{color:var(--muted); font-size:10.5px}
.tq .ext{color:var(--gold); font-size:10px; margin-left:2px}
.bar{display:flex; align-items:center; gap:10px; padding:6px 12px; border-bottom:1px solid var(--rule); background:var(--bg); flex-wrap:wrap}
.logo{font-weight:700; display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-size:15px; margin-right:4px}
.logo svg{width:26px; height:26px; border-radius:6px}
.logo .wm{font-weight:800; letter-spacing:.12em; font-size:14px} .logo .wm span{color:#9ADCC6}
.sym{display:flex; align-items:center; gap:6px}
.search{position:relative}
.sym input{width:280px; background:var(--panel); border:1px solid var(--rule2); border-radius:4px; padding:7px 10px; font-family:var(--mono); font-weight:600}
.sym input:focus{border-color:var(--blue)}
.sug{position:absolute; top:calc(100% + 4px); left:0; min-width:360px; background:var(--panel); border:1px solid var(--rule2); border-radius:6px; box-shadow:0 12px 32px rgba(0,0,0,.5); z-index:30; overflow:hidden}
.sug button{display:flex; justify-content:space-between; gap:12px; width:100%; text-align:left; background:none; border:0; padding:8px 12px; cursor:pointer}
.sug button:hover,.sug button[aria-selected="true"]{background:var(--panel2)}
.sug b{font-family:var(--mono)} .sug span{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .sug small{color:var(--muted); font-size:11px; margin-left:6px}
.chips{display:flex; gap:2px; overflow-x:auto; max-width:46vw; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0; background:transparent; border-radius:4px; padding:5px 8px; cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap}
.chip:hover{background:var(--panel2); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--panel2); color:var(--ink); font-weight:600}
.chip.lock::after{content:" ·"; color:var(--gold)}
.right{margin-left:auto; display:flex; align-items:center; gap:6px}
.btn{border:1px solid var(--rule2); border-radius:4px; padding:6px 10px; font-weight:600; cursor:pointer; background:var(--panel); color:var(--ink); font-size:12px}
.btn:hover{background:var(--panel2)}
.btn.gold{background:var(--gold); color:var(--gold-ink); border-color:transparent}
.btn.blue{background:var(--blue); color:#fff; border-color:transparent}
.btn.small{padding:4px 8px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.badge{font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:3px; border:1px solid var(--rule2); color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.badge.pro{background:var(--gold); color:var(--gold-ink); border-color:transparent}
.badge.demo{border-color:var(--neg); color:var(--neg)}
.badge.up{color:var(--pos); border-color:var(--pos); text-transform:none} .badge.dn{color:var(--neg); border-color:var(--neg); text-transform:none}
.up{color:var(--pos)} .dn{color:var(--neg)}
.symrow{display:flex; align-items:center; gap:12px; padding:6px 12px; border-bottom:1px solid var(--rule); flex-wrap:wrap; min-height:44px}
#symName{font-weight:600; font-size:14px}
.quote{display:flex; align-items:baseline; gap:8px} .quote .px{font-size:20px; font-weight:700} .quote .chg{font-size:13px}
.live{display:inline-flex; align-items:center; gap:5px; color:var(--pos); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em}
.live i{width:7px; height:7px; border-radius:50%; background:var(--pos); box-shadow:0 0 0 0 rgba(38,166,154,.6); animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(38,166,154,.6)} 70%{box-shadow:0 0 0 6px rgba(38,166,154,0)} 100%{box-shadow:0 0 0 0 rgba(38,166,154,0)}}
@media (prefers-reduced-motion:reduce){ .live i{animation:none} }
tr.fresh td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 28%,transparent)} to{background:transparent}}
.asof{font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; margin-left:auto}
#tvChart{height:62vh; min-height:400px; border-bottom:1px solid var(--rule); background:var(--bg)}
.tvfb{height:100%; overflow:auto; padding:0 8px}
.tvfb svg{max-height:calc(62vh - 120px) !important}
@media (max-width:980px){ .tvfb svg{max-height:calc(52vh - 120px) !important} }
.tabs{display:block; border-bottom:1px solid var(--rule); padding:0; background:var(--bg); position:sticky; top:0; z-index:4}
.tabs-primary{display:flex; gap:2px; padding:6px 10px 0; border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none}
.tab-g{border:0; background:transparent; color:var(--muted); padding:8px 14px 10px; font:600 12px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tab-g:hover{color:var(--ink)} .tab-g[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--gold)}
.tab-g.util{margin-left:auto; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0}
.tabs-secondary{display:flex; gap:4px; padding:6px 10px; overflow-x:auto; scrollbar-width:none; background:var(--panel)}
.tabs-secondary .tab{border:1px solid transparent; border-radius:5px; padding:5px 11px; font:500 12.5px/1 var(--sans); color:var(--muted); background:transparent; margin:0}
.tabs-secondary .tab:hover{color:var(--ink); background:var(--panel2)}
.tabs-secondary .tab[aria-selected="true"]{color:var(--ink); background:var(--panel2); border-color:var(--rule2); font-weight:600}
.card{background:var(--panel); border-radius:8px}
.card h2{font:600 11px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--rule)}
.btn{font-family:var(--sans); font-weight:600; letter-spacing:.01em; border-radius:6px; transition:background .12s, border-color .12s}
.btn:hover{border-color:var(--rule2)}
.btn.gold{background:var(--gold); color:#1a1200; border-color:var(--gold)} .btn.gold:hover{filter:brightness(1.06)}
.bar{border-bottom:1px solid var(--rule); background:var(--bg)}
#symIn{font-family:var(--mono); font-weight:600; letter-spacing:.04em; border-radius:6px}
.chip{font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; border-radius:5px; color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink); background:var(--panel2); border:1px solid var(--rule2)}
.symrow{padding:12px 14px} #symName{font-weight:600; letter-spacing:-.01em; color:var(--ink)}
.quote .px{font-size:22px; letter-spacing:-.02em} .badge{border-radius:4px; font-weight:600; letter-spacing:.06em}
.tape{height:32px} .tq{font-size:12px} .tq b{letter-spacing:.06em}
.ctl{font-size:12.5px} .data th{font:600 11px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 7px}
.data td{font-size:12.5px} .ladder-head{font-size:10.5px}
.lvl .n{font-size:12.5px} .lvl .v{font-size:15px}
.notice,.empty{border-radius:8px}
dialog .dlg h2{font:700 16px/1.2 var(--sans); letter-spacing:-.01em; text-transform:none; color:var(--ink); border:0; padding:0}
.lvl:nth-child(odd){background:var(--panel2)}
:root[data-theme="blackout"] .heat{border-color:var(--rule2)}
:root[data-theme="blackout"] .btn:not(.gold):not(.blue){background:var(--panel2)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent; border:0; border-bottom:2px solid transparent; padding:9px 12px; cursor:pointer; color:var(--muted); font-weight:600; white-space:nowrap; font-size:12.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--blue)}
.work{display:grid; grid-template-columns:1fr 320px; gap:0}
.main{padding:12px; min-width:0; border-right:1px solid var(--rule)}
.rail{padding:12px; display:flex; flex-direction:column; gap:12px}
.card{background:transparent; border:1px solid var(--rule); border-radius:6px; padding:12px}
.card h2{font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; text-transform:uppercase}
#panel{border:0; padding:0}
.levels{display:grid; gap:2px}
.lvl{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:6px 8px; border-radius:4px}
.lvl:nth-child(odd){background:var(--panel)}
.lvl b{font-weight:500}
.lvl .v{font-family:var(--mono); font-weight:600; font-size:14px}
.lvl small{display:block; color:var(--muted); font-size:11px}
.lvl .q{display:inline-grid; place-items:center; width:13px; height:13px; border-radius:50%; border:1px solid var(--rule2); color:var(--muted); font-size:9px; margin-left:5px; vertical-align:1px; cursor:help}
.regime{padding:8px 10px; border-radius:4px; border-left:3px solid var(--rule2); background:var(--panel); margin-bottom:8px}
.regime.pos{border-left-color:var(--pos)} .regime.neg{border-left-color:var(--neg)}
.regime b{display:block; font-size:13px}
.read{font-size:12.5px; line-height:1.55}
.read p{margin:0 0 8px}
.hint{color:var(--muted); font-size:12px}
.ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--muted)}
.ctl select,.ctl input[type=range]{background:var(--panel); border:1px solid var(--rule2); border-radius:4px; padding:4px 6px; color:var(--ink)}
.ctl label{display:flex; gap:6px; align-items:center}
.exps{display:flex; gap:2px; flex-wrap:wrap}
.heat{overflow:auto; border:1px solid var(--rule); border-radius:4px; background:var(--bg)}
table.hm{border-collapse:separate; border-spacing:1px; font-family:var(--mono); font-size:11px; min-width:100%}
table.hm th{position:sticky; top:0; background:var(--bg); color:var(--muted); font-weight:500; padding:6px 4px; z-index:1; white-space:nowrap}
table.hm th:first-child,table.hm td:first-child{position:sticky; left:0; background:var(--bg); z-index:2; text-align:right; padding:0 8px; font-weight:600}
table.hm td{width:70px; height:22px; text-align:center; border-radius:2px; color:var(--ink); cursor:pointer; position:relative}
table.hm td.spotrow:first-child{color:var(--spot); box-shadow:inset 0 0 0 1px var(--spot)}
table.hm td.em:first-child{border-left:3px solid var(--gold)}
table.hm tr.spot td{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--spot) 60%,transparent)}
table.hm td.node::after{content:"◆"; position:absolute; top:1px; right:3px; font-size:8px; color:var(--gold)}
.tip{position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--rule2); border-radius:4px; padding:8px 10px; font-size:12px; font-family:var(--mono); z-index:20; display:none; box-shadow:0 10px 30px rgba(0,0,0,.4); white-space:pre}
svg text{font-family:var(--mono); fill:var(--muted); font-size:11px}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap}
.legend i{display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:4px}
table.data{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px}
table.data th{text-align:right; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--rule); white-space:nowrap}

table.data tr:hover td{background:var(--panel)}
table.data th:first-child,table.data td:first-child{text-align:left}
.c{color:var(--pos)} .p{color:var(--neg)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.empty{padding:40px; text-align:center; color:var(--muted)}

.perks{margin:0; padding:0; list-style:none; display:grid; gap:6px; font-size:12.5px} .perks li{padding-left:18px; position:relative} .perks li::before{content:"✓"; position:absolute; left:0; color:var(--pos)}

function bsPrice(S, K, T, sig, type){ if (T <= 0) return Math.max(0, type==="C" ? S-K : K-S); const sq = sig*Math.sqrt(T); const d1 = (Math.log(S/K) + 0.5*sig*sig*T)/sq, d2 = d1-sq; const N = x => 0.5*(1+erf(x/Math.SQRT2)); return type==="C" ? S*N(d1) - K*N(d2) : K*N(-d2) - S*N(-d1); }
